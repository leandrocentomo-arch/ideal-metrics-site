# O site e estatico: nao ha nada para compilar.
# Este arquivo existe para o Netlify nao tentar rodar um build proprio (um build
# que falha deixa o ar parado no ultimo deploy bom, que foi o que aconteceu entre
# 22 e 23/09/2026: o GitHub tinha oito commits que o dominio nao servia).
[build]
  publish = "."
  command = ""

# A pagina nunca fica em cache do CDN, para a proxima troca aparecer na hora.
# Imagem, folha e script levam ?v= no HTML, entao podem ficar em cache.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 19/10/2026: a pagina de clientes saiu do site; quem tiver o link antigo cai na home
[[redirects]]
  from = "/clientes.html"
  to = "/"
  status = 301

# 19/10/2026: um endereco so para o Google. ideal-metrics.com tambem servia o site inteiro (conteudo duplicado);
# agora manda para idealmetrics.org, que e o canonical de todas as paginas.
[[redirects]]
  from = "https://ideal-metrics.com/*"
  to = "https://idealmetrics.org/:splat"
  status = 301
  force = true
